// Wait for D3 and d3-sankey to load before processing data
window.addEventListener('load', function() {
  // Process the embedded data
  const links = [];
  const productValues = {}; // Total value per product category
  const modeValues = {};    // Total value per transport mode

  // Skip header row (index 0) and process data rows
  for (let i = 1; i < rawData.length; i++) {
    const row = rawData[i];
    const product = row[0];
    const mode = row[1];
    const value = row[2];

    links.push({source: product, target: mode, value: value});

    productValues[product] = (productValues[product] || 0) + value;
    modeValues[mode] = (modeValues[mode] || 0) + value;
  }

  // Create unique nodes with layer assignment
  // Layer 0 = products (left), Layer 1 = transport modes (right)
  const nodesSet = new Set();
  links.forEach(l => { 
    nodesSet.add(l.source); 
    nodesSet.add(l.target); 
  });

  let nodes = Array.from(nodesSet).map(name => ({
    name,
    // Identify transport modes to place on right side
    layer: name === "Road" || name === "Air" || name === "Waterway" || name === "Other types" ? 1 : 0
  }));

  // Attach total values for sorting
  nodes.forEach(n => {
    n.totalValue = n.layer === 0 ? (productValues[n.name] || 0) : (modeValues[n.name] || 0);
  });

  // Sort: Layer 0 first, then by descending value within each layer
  nodes.sort((a,b) => {
    if (a.layer !== b.layer) return a.layer - b.layer;
    return b.totalValue - a.totalValue; // Highest value first
  });

  // Assign index after sorting
  nodes.forEach((n,i) => n.index = i);

  // Convert link source/target from names to indices
  links.forEach(l => {
    l.source = nodes.findIndex(n => n.name === l.source);
    l.target = nodes.findIndex(n => n.name === l.target);
  });

  // Draw the Sankey diagram
  drawSankey({nodes, links});
});

function drawSankey({nodes, links}) {
  // Much larger canvas to avoid overlapping labels
  const width = 2400;
  const height = 3000;

  const svg = d3.select("svg")
    .attr("viewBox", [0, 0, width, height]);

  // Configure sankey layout with more spacing
  const sankey = d3.sankey()
    .nodeId(d => d.index)
    .nodeWidth(30)          // Slightly wider nodes for visibility
    .nodePadding(25)        // More padding between nodes to prevent overlap
    .extent([[300, 120], [width-300, height-120]]) // More left/right margin for labels
    .nodeSort(null);        // Keep our custom sort order

  const {nodes: laidNodes, links: laidLinks} = sankey({nodes, links});

  // Create gradient definitions
  const defs = svg.append("defs");

  // Tooltip element
  const tooltip = d3.select("#tooltip");

  // Draw links (flows) with gradients
  const link = svg.append("g")
    .selectAll("path")
    .data(laidLinks)
    .join("path")
      .attr("d", d3.sankeyLinkHorizontal())
      .attr("stroke", d => {
        // Create unique gradient for each link
        const id = `gradient-${d.source.index}-${d.target.index}`;
        const grad = defs.append("linearGradient")
          .attr("id", id)
          .attr("gradientUnits", "userSpaceOnUse")
          .attr("x1", d.source.x1)
          .attr("x2", d.target.x0);
        
        // Gradient from source color to target color
        grad.append("stop")
          .attr("offset","0%")
          .attr("stop-color", d3.schemeTableau10[d.source.index % 10]);
        grad.append("stop")
          .attr("offset","100%")
          .attr("stop-color", d3.schemeTableau10[d.target.index % 10]);
        
        return `url(#${id})`;
      })
      .attr("stroke-width", d => Math.max(1, d.width)) // Link width based on value
      .attr("opacity", 0.5)
      .attr("fill", "none")
      // Hover effects for links
      .on("mouseover", function(event, d) {
        d3.select(this).attr("opacity", 0.8);
        tooltip
          .style("opacity", 1)
          .html(`<strong>${d.source.name}</strong> → <strong>${d.target.name}</strong><br/>
                 Giá trị: <strong>${(d.value/1e9).toFixed(2)} billions USD</strong>`)
          .style("left", (event.pageX + 15) + "px")
          .style("top", (event.pageY - 28) + "px");
      })
      .on("mouseout", function() {
        d3.select(this).attr("opacity", 0.5);
        tooltip.style("opacity", 0);
      });

  // Draw nodes (rectangles)
  const node = svg.append("g")
    .selectAll("g")
    .data(laidNodes)
    .join("g");

  node.append("rect")
    .attr("x", d => d.x0)
    .attr("y", d => d.y0)
    .attr("height", d => Math.max(8, d.y1 - d.y0)) // Minimum height for visibility
    .attr("width", d => d.x1 - d.x0)
    .attr("fill", d => d3.schemeTableau10[d.index % 10])
    .attr("stroke", "#fff")
    .attr("stroke-width", 1);

  // Add labels for node names
  // Left side labels (products) are right-aligned, right side (modes) are left-aligned
  node.append("text")
    .attr("x", d => d.layer === 0 ? d.x0 - 12 : d.x1 + 12)
    .attr("y", d => (d.y0 + d.y1) / 2)
    .attr("dy", "0.35em")
    .attr("text-anchor", d => d.layer === 0 ? "end" : "start")
    .style("font-weight", "600")
    .style("font-size", "14px")
    .style("fill", "#333")
    // Truncate very long names
    .text(d => d.name.length > 40 ? d.name.substring(0, 37) + "..." : d.name);

  // Add value labels below the name
  node.append("text")
    .attr("x", d => d.layer === 0 ? d.x0 - 12 : d.x1 + 12)
    .attr("y", d => (d.y0 + d.y1) / 2 + 18)
    .attr("text-anchor", d => d.layer === 0 ? "end" : "start")
    .style("font-size", "12px")
    .style("fill", "#666")
    .text(d => (d.value / 1e9).toFixed(1) + " billions USD");

  // Chart title
  svg.append("text")
    .attr("x", width / 2)
    .attr("y", 50)
    .attr("text-anchor", "middle")
    .style("font-size", "32px")
    .style("font-weight", "bold")
    .style("fill", "#0d47a1")
    .text("XUẤT KHẨU VIỆT NAM QUÝ 3/2025");
    
  // Subtitle
  svg.append("text")
    .attr("x", width / 2)
    .attr("y", 85)
    .attr("text-anchor", "middle")
    .style("font-size", "16px")
    .style("fill", "#555")
    .text("By product group and shipping method (sort by value)");
}
